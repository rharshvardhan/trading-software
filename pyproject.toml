[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "four-candle-reversal-scanner"
version = "0.2.0"
description = "Terminal and FastAPI scanner for the user's four candle reversal strategy (setup and entry)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
four-candle-scan = "trading_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_scanner = ["fixture_data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
